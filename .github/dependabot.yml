# Weekly dependency updates, grouped so minor and patch bumps come as one PR
# per ecosystem. PRs target develop, like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

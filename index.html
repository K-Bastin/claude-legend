<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Legend</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="brand">
          <span class="logo">✻</span>
          <span class="name">Claude Legend</span>
          <span class="spacer"></span>
          <button id="btn-new" class="icon" title="Nouvelle session (Ctrl+Shift+T)">＋</button>
          <button id="btn-sync" class="icon" title="Synchroniser maintenant">⟳</button>
          <button id="btn-settings" class="icon" title="Réglages">⚙</button>
        </header>
        <input id="search" type="search" placeholder="Rechercher une conversation…" autocomplete="off" />
        <div id="session-list"></div>
        <footer id="status"></footer>
      </aside>
      <main id="main">
        <div id="tabbar" class="hidden">
          <nav id="tabs"></nav>
          <div id="layouts" role="group" aria-label="Disposition des panneaux"></div>
        </div>
        <div id="terminals" class="layout-1"></div>
        <div id="term-holder" hidden></div>
        <div id="welcome">
          <div class="welcome-box">
            <div class="big-logo">✻</div>
            <h1>Claude Legend</h1>
            <p>Reprends une conversation dans la liste de gauche,<br />ou démarre une nouvelle session dans un dossier.</p>
            <button id="btn-new-welcome" class="primary">Nouvelle session…</button>
            <p id="welcome-warning" class="warning"></p>
          </div>
        </div>
      </main>
    </div>

    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <h2>Réglages</h2>
        <fieldset id="sync-fields">
          <legend>Synchronisation</legend>
          <label>Type
            <select name="syncKind">
              <option value="none">Désactivée</option>
              <option value="folder">Dossier synchronisé (Syncthing, Nextcloud, OneDrive…)</option>
              <option value="sftp">Serveur SFTP (SSH)</option>
              <option value="ftp">Serveur FTP / FTPS</option>
              <option value="webdav">WebDAV (Nextcloud, ownCloud, NAS…)</option>
            </select>
          </label>
          <label data-kinds="folder">Dossier
            <span class="row">
              <input name="folderPath" placeholder="ex. ~/Sync" />
              <button type="button" id="pick-sync-dir">Parcourir…</button>
            </span>
            <small>Le même dossier, synchronisé sur tous tes PC par un autre outil.</small>
          </label>
          <label data-kinds="webdav">Adresse WebDAV
            <input name="webdavUrl" placeholder="https://cloud.exemple.fr/remote.php/dav/files/moi/claude-legend" />
          </label>
          <div class="row" data-kinds="sftp ftp">
            <label>Serveur <input name="host" placeholder="nas.local" /></label>
            <label class="narrow">Port <input name="port" type="number" min="1" max="65535" /></label>
          </div>
          <label data-kinds="sftp ftp webdav">Utilisateur <input name="user" autocomplete="off" /></label>
          <label data-kinds="sftp">Authentification
            <select name="sftpAuth">
              <option value="password">Mot de passe</option>
              <option value="key">Clé privée</option>
              <option value="agent">Agent SSH</option>
            </select>
          </label>
          <label data-kinds="sftp-key">Clé privée
            <span class="row">
              <input name="keyPath" placeholder="~/.ssh/id_ed25519" />
              <button type="button" id="pick-key">Parcourir…</button>
            </span>
          </label>
          <label data-kinds="sftp-password sftp-key ftp webdav"><span id="secret-label">Mot de passe</span>
            <input name="secret" type="password" autocomplete="new-password" />
            <small>Conservé dans le trousseau du système, jamais dans un fichier.</small>
          </label>
          <label data-kinds="ftp" class="check"><input name="ftpSecure" type="checkbox" /> Chiffrer la connexion (FTPS)</label>
          <label data-kinds="sftp ftp">Dossier distant
            <input name="remotePath" placeholder="claude-legend" />
            <small>Relatif au dossier de connexion, ou absolu (/srv/claude-legend).</small>
          </label>
          <p id="fingerprint" data-kinds="sftp"></p>
          <div class="row test-row" data-kinds="folder sftp ftp webdav">
            <button type="button" id="test-sync">Tester la connexion</button>
            <span id="test-result"></span>
          </div>
        </fieldset>
        <label>Nom de ce PC
          <input name="machineName" required />
        </label>
        <label>Exécutable Claude
          <input name="claudePath" placeholder="détection automatique" />
          <small id="claude-detected"></small>
        </label>
        <label>Arguments supplémentaires
          <input name="extraArgs" placeholder="ex. --model opus" />
        </label>
        <div class="row">
          <label>Taille de police
            <input name="fontSize" type="number" min="8" max="32" />
          </label>
          <label>Synchro toutes les (s)
            <input name="syncIntervalSecs" type="number" min="15" max="3600" />
          </label>
        </div>
        <menu>
          <button value="cancel" formnovalidate>Annuler</button>
          <button value="save" class="primary">Enregistrer</button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form method="dialog">
        <p id="confirm-message"></p>
        <menu id="confirm-buttons"></menu>
      </form>
    </dialog>

    <div id="toasts"></div>
  </body>
</html>
